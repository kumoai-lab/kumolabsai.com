    <script>
      // 在首次绘制前恢复主题与语言，避免刷新时闪白/闪黑、语言标记错误
      try {
        var t = localStorage.getItem('kumo-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
        }
        var l = localStorage.getItem('kumo-lang')
        if (l !== 'en' && l !== 'zh') {
          l = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'
        }
        document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en'
      } catch (e) {}
    </script>
